<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wannie Music">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Wannie’s Music Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E7EAF1;
  --surface: #F6F7FA;
  --ink: #1F2A4A;
  --muted: #5C6683;
  --line: #C9CFDD;
  --accent: #3550C8;
  --glow: #F0B429;
  --heart: #D6336C;
  --on-accent: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141B30;
    --surface: #1D2642;
    --ink: #E8ECF7;
    --muted: #9AA3BF;
    --line: #2E3958;
    --accent: #8FA2F5;
    --glow: #F5C451;
    --heart: #F06595;
    --on-accent: #141B30;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(220px + env(safe-area-inset-bottom, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

header { padding: 36px 0 16px; }
h1 {
  font-size: clamp(2.3rem, 9vw, 3.8rem);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin: 0 0 10px;
}
.count { color: var(--muted); margin: 0; }

/* Tabs */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tab { padding: 10px 0; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }

/* Search + sort */
.toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
.toolbar input, .toolbar select {
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.toolbar input { flex: 1; min-width: 0; }

/* Filter chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 3px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 6px 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  white-space: nowrap;
  font-size: 0.9rem;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.year { font-variant-numeric: tabular-nums; font-weight: 600; }

/* Song rows */
ol.songs { list-style: none; margin: 8px 0 0; padding: 0; }
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "main acts" "tags acts";
  column-gap: 8px;
  row-gap: 6px;
  padding: 13px 2px;
  border-bottom: 1px solid var(--line);
}
.main { grid-area: main; text-align: left; min-width: 0; }
.main .t { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.05rem; }
.main .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main .o { display: block; color: var(--muted); font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.current .main .t { color: var(--accent); }
.tags { grid-area: tags; display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 0.78rem;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
}
.tag.year { color: var(--accent); border-color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.acts { grid-area: acts; display: flex; align-items: center; }
.icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.icon svg { width: 22px; height: 22px; }
.heart svg path { fill: none; stroke: currentColor; stroke-width: 2; }
.heart.on { color: var(--heart); }
.heart.on svg path { fill: currentColor; }

.bars { display: none; gap: 2px; align-items: flex-end; height: 14px; flex: none; }
.row.current.playing .bars { display: inline-flex; }
.bars i { width: 3px; background: var(--accent); border-radius: 2px; animation: bounce 0.9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: -0.3s; }
.bars i:nth-child(3) { animation-delay: -0.6s; }
@keyframes bounce { 0%,100% { height: 4px } 50% { height: 14px } }

.empty { color: var(--muted); padding: 24px 2px; }
.link { color: var(--accent); font-weight: 600; text-decoration: underline; }

/* Playlists */
.newlist { display: flex; gap: 8px; margin: 4px 0 12px; }
.newlist input { flex: 1; min-width: 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.btn { padding: 10px 16px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.pl { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; padding: 16px 2px; border-bottom: 1px solid var(--line); }
.pl strong { font-size: 1.1rem; }
.pl span { color: var(--muted); font-size: 0.9rem; }
.plhead { margin: 4px 0 6px; }
.plhead .back { color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.plhead h2 { font-size: 1.8rem; line-height: 1.1; margin: 0 0 4px; letter-spacing: -0.02em; }
.plhead p { color: var(--muted); margin: 0 0 12px; }
.plhead .btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* Player dock */
.dock {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--ink);
  color: var(--bg);
  padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  border-radius: 22px 22px 0 0;
  z-index: 5;
}
.dock .wrap { display: grid; gap: 8px; }
.now { display: flex; align-items: center; gap: 14px; min-width: 0; }
.disc {
  position: relative;
  flex: 0 0 56px; height: 56px; border-radius: 50%;
  background-size: cover; background-position: center;
  background: radial-gradient(circle, var(--glow) 0 18%, var(--ink) 19% 23%, var(--accent) 24% 100%);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
}
.dock.playing .disc { animation: spin 6s linear infinite; }
.disc.cover { background: var(--ink) center / cover no-repeat; }
@keyframes spin { to { transform: rotate(360deg); } }
.meta { min-width: 0; flex: 1; }
.meta .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .a { opacity: 0.7; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .heart { color: inherit; opacity: 0.8; }
.dock .heart.on { color: var(--heart); opacity: 1; }

.seek { display: grid; grid-template-columns: 3rem 1fr 3rem; align-items: center; gap: 8px; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.seek span:last-child { text-align: right; }
input[type=range] { width: 100%; accent-color: var(--glow); height: 24px; }

.controls { display: flex; justify-content: space-between; align-items: center; }
.controls button { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; opacity: 0.75; position: relative; }
.controls button.on { opacity: 1; color: var(--glow); }
.controls button svg { width: 22px; height: 22px; fill: currentColor; }
.controls .play { width: 60px; height: 60px; background: var(--glow); color: #1F2A4A; opacity: 1; }
.controls .play svg { width: 28px; height: 28px; }
.repeat-one::after { content: "1"; position: absolute; font-size: 0.6rem; font-weight: 800; top: 8px; right: 8px; }

/* Add-to-playlist sheet */
dialog {
  border: 0;
  border-radius: 20px;
  padding: 22px;
  width: min(92vw, 440px);
  background: var(--surface);
  color: var(--ink);
}
dialog::backdrop { background: rgba(10, 14, 30, 0.55); }
dialog h2 { font-size: 1.25rem; margin: 0 0 14px; line-height: 1.2; }
.check { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.sheetnote { color: var(--muted); margin: 0 0 6px; }
dialog form { display: flex; gap: 8px; margin: 16px 0 12px; }
dialog form input { flex: 1; min-width: 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
dialog .done { width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .dock.playing .disc, .bars i { animation: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="siteTitle">Wannie’s Music Archive</h1>
    <p class="count" id="count"></p>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div class="toolbar" id="toolbar">
    <input id="search" type="search" placeholder="Search song, singer or program" autocomplete="off">
    <select id="sort" aria-label="Sort songs">
      <option value="new">Newest</option>
      <option value="old">Oldest</option>
      <option value="az">A–Z</option>
    </select>
  </div>

  <div id="filters">
    <div class="chips" id="yearChips" aria-label="Filter by year"></div>
    <div class="chips" id="programChips" aria-label="Filter by program"></div>
  </div>

  <main id="content"></main>
</div>

<div class="dock" id="dock">
  <div class="wrap">
    <div class="now">
      <div class="disc" id="disc" aria-hidden="true"></div>
      <div class="meta">
        <div class="t" id="nowTitle">Pick a song to start</div>
        <div class="a" id="nowArtist">&nbsp;</div>
      </div>
      <button class="icon heart" id="nowHeart" aria-label="Like this song" aria-pressed="false" hidden></button>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="bar" min="0" max="100" step="0.1" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button id="shuffle" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1Z"/></svg></button>
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="play" class="play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="playPath" d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button id="repeat" class="on" aria-label="Repeat: all"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
  </div>
</div>

<dialog id="sheet">
  <h2 id="sheetTitle"></h2>
  <div id="sheetLists"></div>
  <form id="sheetForm">
    <input id="sheetNew" placeholder="New playlist name" maxlength="60">
    <button class="btn" type="submit">Create</button>
  </form>
  <button class="btn ghost done" id="sheetDone" type="button">Done</button>
</dialog>

<!-- One single audio element is what keeps music playing in the background on phones -->
<audio id="audio" preload="metadata" playsinline></audio>

<script src="songs.js"></script>
<script>
const SITE_TITLE = "Wannie’s Music Archive";
const MUSIC_FOLDER = "music/";

const ICON = {
  heart: '<svg viewBox="-1 -1 26 26"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
  add: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v14h-2zM5 11h14v2H5z"/></svg>',
  remove: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 11h14v2H5z"/></svg>'
};
const PLAY_PATH = "M8 5v14l11-7z";
const PAUSE_PATH = "M6 5h4v14H6zm8 0h4v14h-4z";

// ---------- Data ----------
// Songs can live in several repositories. songs.js lists where each "part" is.
function musicBase(part) {
  const parts = typeof MUSIC_PARTS !== "undefined" ? MUSIC_PARTS : {};
  let base = parts[part || 1] || MUSIC_FOLDER;
  if (!base.endsWith("/")) base += "/";
  return base;
}
const songs = (typeof SONGS !== "undefined" ? SONGS : []).map((s, i) => ({
  ...s,
  i,
  id: s.file,
  year: s.year ? String(s.year) : "",
  src: musicBase(s.part) + encodeURIComponent(s.file)
}));
const byId = new Map(songs.map(s => [s.id, s]));
const years = [...new Set(songs.map(s => s.year).filter(Boolean))].sort((a, b) => b.localeCompare(a));
const programs = [...new Set(songs.map(s => s.program).filter(Boolean))].sort();

function read(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function write(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

let likes = new Set(read("wma-likes", []));
let playlists = read("wma-playlists", []);
const saveLikes = () => write("wma-likes", [...likes]);
const saveLists = () => write("wma-playlists", playlists);

// ---------- View state ----------
let view = "all";            // "all" | "liked" | "lists" | "pl:<id>"
let yearFilter = "", programFilter = "", query = "", sortBy = "new";
let visible = [];            // song indexes currently shown

const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

document.title = SITE_TITLE;
$("siteTitle").textContent = SITE_TITLE;
$("count").textContent = songs.length + (songs.length === 1 ? " song" : " songs") +
  (years.length ? ", " + years[years.length - 1] + "–" + years[0] : "");

// ---------- Rendering ----------
function renderTabs() {
  const tabs = [["all", "All songs"], ["liked", "Liked " + (likes.size || "")], ["lists", "Playlists " + (playlists.length || "")]];
  const nav = $("tabs"); nav.innerHTML = "";
  for (const [key, label] of tabs) {
    const b = el("button", "tab", label.trim());
    b.setAttribute("role", "tab");
    const active = view === key || (key === "lists" && view.startsWith("pl:"));
    b.setAttribute("aria-selected", active);
    b.onclick = () => { view = key; render(); };
    nav.append(b);
  }
}

function chip(label, pressed, onClick, extra) {
  const b = el("button", "chip" + (extra ? " " + extra : ""), label);
  b.setAttribute("aria-pressed", pressed);
  b.onclick = onClick;
  return b;
}

function renderFilters() {
  const y = $("yearChips"), p = $("programChips");
  y.innerHTML = ""; p.innerHTML = "";
  y.append(chip("All years", !yearFilter, () => { yearFilter = ""; render(); }));
  for (const yr of years) y.append(chip(yr, yearFilter === yr, () => { yearFilter = yearFilter === yr ? "" : yr; render(); }, "year"));
  if (programs.length > 1) {
    p.append(chip("All programs", !programFilter, () => { programFilter = ""; render(); }));
    for (const pr of programs) p.append(chip(pr, programFilter === pr, () => { programFilter = programFilter === pr ? "" : pr; render(); }));
  }
}

function currentPlaylist() { return view.startsWith("pl:") ? playlists.find(p => p.id === view.slice(3)) : null; }

function getVisible() {
  const pl = currentPlaylist();
  let list;
  if (pl) list = pl.songs.map(id => byId.get(id)).filter(Boolean);
  else if (view === "liked") list = songs.filter(s => likes.has(s.id));
  else list = songs.slice();

  if (!pl) {
    if (yearFilter) list = list.filter(s => s.year === yearFilter);
    if (programFilter) list = list.filter(s => s.program === programFilter);
  }
  const q = query.trim().toLowerCase();
  if (q) list = list.filter(s => [s.title, s.original, s.program, s.year].join(" ").toLowerCase().includes(q));

  if (!pl) {
    if (sortBy === "az") list.sort((a, b) => a.title.localeCompare(b.title));
    else if (sortBy === "old") list.sort((a, b) => a.year.localeCompare(b.year) || a.i - b.i);
    else list.sort((a, b) => b.year.localeCompare(a.year) || a.i - b.i);
  }
  return list;
}

function songRow(s, pl) {
  const li = el("li", "row");
  li.dataset.i = s.i;

  const main = el("button", "main");
  const t = el("span", "t");
  t.append(el("span", null, s.title));
  const bars = el("span", "bars"); bars.innerHTML = "<i></i><i></i><i></i>"; bars.setAttribute("aria-hidden", "true");
  t.append(bars);
  main.append(t, el("span", "o", s.original ? "Original by " + s.original : ""));
  main.onclick = () => {
    if (s.i === current) { toggle(); return; }
    setQueue(visible);
    playSong(s.i, true);
  };

  const tags = el("div", "tags");
  if (s.year) {
    const b = el("button", "tag year", s.year);
    b.setAttribute("aria-label", "Show songs from " + s.year);
    b.onclick = () => { yearFilter = s.year; programFilter = ""; view = view === "liked" ? "liked" : "all"; render(); };
    tags.append(b);
  }
  if (s.program) {
    const b = el("button", "tag", s.program);
    b.setAttribute("aria-label", "Show songs from " + s.program);
    b.onclick = () => { programFilter = s.program; yearFilter = ""; view = view === "liked" ? "liked" : "all"; render(); };
    tags.append(b);
  }

  const acts = el("div", "acts");
  const heart = el("button", "icon heart" + (likes.has(s.id) ? " on" : ""));
  heart.innerHTML = ICON.heart;
  heart.setAttribute("aria-label", "Like " + s.title);
  heart.setAttribute("aria-pressed", likes.has(s.id));
  heart.onclick = () => toggleLike(s.id);
  acts.append(heart);

  if (pl) {
    const rm = el("button", "icon");
    rm.innerHTML = ICON.remove;
    rm.setAttribute("aria-label", "Remove " + s.title + " from " + pl.name);
    rm.onclick = () => { pl.songs = pl.songs.filter(id => id !== s.id); saveLists(); render(); };
    acts.append(rm);
  } else {
    const add = el("button", "icon");
    add.innerHTML = ICON.add;
    add.setAttribute("aria-label", "Add " + s.title + " to a playlist");
    add.onclick = () => openSheet(s);
    acts.append(add);
  }

  li.append(main, tags, acts);
  return li;
}

function renderPlaylists(c) {
  const form = el("form", "newlist");
  const input = el("input"); input.placeholder = "Name a new playlist"; input.maxLength = 60;
  const btn = el("button", "btn", "Create playlist"); btn.type = "submit";
  form.append(input, btn);
  form.onsubmit = e => { e.preventDefault(); const p = createPlaylist(input.value); if (p) { view = "pl:" + p.id; render(); } };
  c.append(form);

  if (!playlists.length) {
    c.append(el("p", "empty", "No playlists yet. Name one above, or tap + next to any song to start one."));
    return;
  }
  for (const p of playlists) {
    const b = el("button", "pl");
    b.append(el("strong", null, p.name), el("span", null, p.songs.length + (p.songs.length === 1 ? " song" : " songs")));
    b.onclick = () => { view = "pl:" + p.id; render(); };
    c.append(b);
  }
}

function renderPlaylistHead(c, pl) {
  const head = el("div", "plhead");
  const back = el("button", "back", "‹ All playlists");
  back.onclick = () => { view = "lists"; render(); };
  head.append(back, el("h2", null, pl.name), el("p", null, pl.songs.length + (pl.songs.length === 1 ? " song" : " songs")));
  const btns = el("div", "btns");
  const playAll = el("button", "btn", "Play all");
  playAll.onclick = () => { if (!visible.length) return; setQueue(visible); playSong(order[0], true); };
  const rename = el("button", "btn ghost", "Rename");
  rename.onclick = () => {
    const n = prompt("Rename playlist", pl.name);
    if (n && n.trim()) { pl.name = n.trim().slice(0, 60); saveLists(); render(); }
  };
  const del = el("button", "btn ghost", "Delete");
  del.onclick = () => {
    if (!confirm("Delete “" + pl.name + "”? The songs stay in the archive.")) return;
    playlists = playlists.filter(p => p !== pl); saveLists(); view = "lists"; render();
  };
  btns.append(playAll, rename, del);
  head.append(btns);
  c.append(head);
}

function render() {
  renderTabs();
  const c = $("content"); c.innerHTML = "";
  const pl = currentPlaylist();
  if (view.startsWith("pl:") && !pl) view = "lists";

  const showList = view !== "lists";
  $("toolbar").hidden = !showList;
  $("sort").hidden = !!pl;
  $("filters").hidden = !showList || !!pl;

  if (view === "lists") { renderPlaylists(c); return; }
  if (pl) renderPlaylistHead(c, pl);
  else renderFilters();

  const list = getVisible();
  visible = list.map(s => s.i);

  if (!list.length) {
    const p = el("p", "empty");
    if (pl && !pl.songs.length) p.textContent = "This playlist is empty. Go to All songs and tap + next to a song to add it here.";
    else if (view === "liked" && !likes.size) p.textContent = "No liked songs yet. Tap the heart next to any song to save it here.";
    else {
      p.textContent = "No songs match these filters. ";
      const clear = el("button", "link", "Clear filters");
      clear.onclick = () => { yearFilter = programFilter = query = ""; $("search").value = ""; render(); };
      p.append(clear);
    }
    c.append(p);
    return;
  }
  const ol = el("ol", "songs");
  for (const s of list) ol.append(songRow(s, pl));
  c.append(ol);
  markCurrent();
}

// ---------- Likes & playlists ----------
function toggleLike(id) {
  likes.has(id) ? likes.delete(id) : likes.add(id);
  saveLikes();
  render();
  updateDockHeart();
}

function createPlaylist(name) {
  name = (name || "").trim().slice(0, 60);
  if (!name) return null;
  const p = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, songs: [] };
  playlists.push(p);
  saveLists();
  return p;
}

let sheetSong = null;
function openSheet(s) {
  sheetSong = s;
  $("sheetTitle").textContent = "Add “" + s.title + "” to a playlist";
  renderSheet();
  $("sheetNew").value = "";
  $("sheet").showModal();
}
function renderSheet() {
  const box = $("sheetLists"); box.innerHTML = "";
  if (!playlists.length) { box.append(el("p", "sheetnote", "You don’t have any playlists yet. Name one below to create it.")); return; }
  for (const p of playlists) {
    const label = el("label", "check");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = p.songs.includes(sheetSong.id);
    cb.onchange = () => {
      if (cb.checked) { if (!p.songs.includes(sheetSong.id)) p.songs.push(sheetSong.id); }
      else p.songs = p.songs.filter(id => id !== sheetSong.id);
      saveLists();
    };
    label.append(cb, el("span", null, p.name));
    box.append(label);
  }
}
$("sheetForm").onsubmit = e => {
  e.preventDefault();
  const p = createPlaylist($("sheetNew").value);
  if (!p) return;
  p.songs.push(sheetSong.id); saveLists();
  $("sheetNew").value = "";
  renderSheet();
};
$("sheetDone").onclick = () => $("sheet").close();
$("sheet").addEventListener("close", render);

// ---------- Player ----------
const audio = $("audio"), dock = $("dock"), bar = $("bar");
let current = -1, queue = [], order = [], shuffle = false, repeat = "all", seeking = false;

function setQueue(ids) { queue = ids.slice(); rebuildOrder(); }
function rebuildOrder() {
  order = queue.slice();
  if (shuffle) {
    for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; }
    const pos = order.indexOf(current);
    if (pos > 0) { order.splice(pos, 1); order.unshift(current); }
  }
}

function fmt(s) { if (!isFinite(s)) return "0:00"; s = Math.floor(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function playSong(i, autoplay, startAt = 0) {
  const s = songs[i];
  if (!s) return;
  current = i;
  audio.src = s.src;
  $("nowTitle").textContent = s.title;
  $("nowArtist").textContent = [s.original && "Original by " + s.original, s.program].filter(Boolean).join(", ") || "\u00a0";
  if (startAt) audio.addEventListener("loadedmetadata", () => { audio.currentTime = startAt; }, { once: true });
  setDisc(null);
  setMeta(s, null);
  getCover(s).then(c => {
    if (current !== s.i) return;      // a different song started meanwhile
    setDisc(c);
    setMeta(s, c);
  });
  updateDockHeart();
  markCurrent();
  saveState();
  if (autoplay) audio.play().catch(() => {});
}

// ---------- Cover art (read from the picture saved inside each mp3) ----------
const APP_ICON = new URL("icon-512.png", location.href).href;
const coverCache = new Map();

function setDisc(cover) {
  const d = $("disc");
  d.classList.toggle("cover", !!cover);
  d.style.backgroundImage = cover ? 'url("' + cover.url + '")' : "";
}

function setMeta(s, cover) {
  if (!("mediaSession" in navigator)) return;
  const artwork = cover
    ? [{ src: cover.url, sizes: "512x512", type: cover.mime }]
    : [{ src: APP_ICON, sizes: "512x512", type: "image/png" }];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: s.title,
    artist: s.original ? "Original by " + s.original : "",
    album: s.program || SITE_TITLE,
    artwork
  });
}

async function getCover(s) {
  if (coverCache.has(s.id)) return coverCache.get(s.id);
  let cover = null;
  try {
    if (s.cover) {
      cover = { url: new URL(s.cover, location.href).href, mime: /\.png$/i.test(s.cover) ? "image/png" : "image/jpeg" };
    } else {
      const tag = await readId3(s.src);
      const pic = tag && findPicture(tag);
      if (pic) cover = await toSquareImage(new Blob([pic.data], { type: pic.mime }));
    }
  } catch (e) {}
  coverCache.set(s.id, cover);
  return cover;
}

// Android's lock screen can't show pictures held in the page's memory, so the cover
// is redrawn as a 512x512 image that is stored inside its own address (a data URL).
async function toSquareImage(blob) {
  const blobUrl = URL.createObjectURL(blob);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = blobUrl; });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement("canvas"); c.width = c.height = 512;
    c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 512, 512);
    return { url: c.toDataURL("image/jpeg", 0.9), mime: "image/jpeg" };
  } finally {
    URL.revokeObjectURL(blobUrl);
  }
}

// Downloads only the start of the mp3, where the picture is stored.
async function readId3(src) {
  const res = await fetch(src, { headers: { Range: "bytes=0-" } });
  if (!res.ok || !res.body) return null;
  const reader = res.body.getReader();
  const chunks = []; let len = 0, need = 10, gotHeader = false;
  while (len < need) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); len += value.length;
    if (!gotHeader && len >= 10) {
      const hd = joinBytes(chunks, len);
      if (hd[0] !== 0x49 || hd[1] !== 0x44 || hd[2] !== 0x33) { reader.cancel().catch(() => {}); return null; }
      const size = syncsafe(hd, 6);
      if (size > 10e6) { reader.cancel().catch(() => {}); return null; }
      need = 10 + size; gotHeader = true;
    }
  }
  reader.cancel().catch(() => {});
  return joinBytes(chunks, len).subarray(0, need);
}
function joinBytes(chunks, len) { const out = new Uint8Array(len); let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; } return out; }
function syncsafe(b, p) { return ((b[p] & 127) << 21) | ((b[p + 1] & 127) << 14) | ((b[p + 2] & 127) << 7) | (b[p + 3] & 127); }
function ascii(b, p, n) { return String.fromCharCode(...b.subarray(p, p + n)); }
function unsync(a) { const out = new Uint8Array(a.length); let j = 0; for (let i = 0; i < a.length; i++) { out[j++] = a[i]; if (a[i] === 0xFF && a[i + 1] === 0x00) i++; } return out.subarray(0, j); }

function findPicture(b) {
  const ver = b[3], flags = b[5];
  let tag = b.subarray(10);
  if ((flags & 0x80) && ver < 4) tag = unsync(tag);
  let p = 0;
  if (flags & 0x40) p = ver === 4 ? syncsafe(tag, 0) : 4 + ((tag[0] << 24) | (tag[1] << 16) | (tag[2] << 8) | tag[3]);
  let best = null;
  while (p < tag.length - 10) {
    let id, size, hdr;
    if (ver === 2) { id = ascii(tag, p, 3); size = (tag[p + 3] << 16) | (tag[p + 4] << 8) | tag[p + 5]; hdr = 6; }
    else { id = ascii(tag, p, 4); size = ver === 4 ? syncsafe(tag, p + 4) : ((tag[p + 4] << 24) >>> 0) + (tag[p + 5] << 16) + (tag[p + 6] << 8) + tag[p + 7]; hdr = 10; }
    if (!/^[A-Z0-9]{3,4}$/.test(id) || size <= 0) break;
    let data = tag.subarray(p + hdr, p + hdr + size);
    if (ver === 4) { const ff = tag[p + 9]; if (ff & 0x01) data = data.subarray(4); if (ff & 0x02) data = unsync(data); }
    if (id === "APIC" || id === "PIC") {
      const pic = parsePicture(data, ver);
      if (pic && (!best || pic.type === 3)) { best = pic; if (pic.type === 3) break; }
    }
    p += hdr + size;
  }
  return best;
}

function parsePicture(d, ver) {
  const enc = d[0]; let p = 1, mime = "";
  if (ver === 2) { mime = ascii(d, 1, 3).toUpperCase() === "PNG" ? "image/png" : "image/jpeg"; p = 4; }
  else { let e = p; while (e < d.length && d[e] !== 0) e++; mime = ascii(d, p, e - p).toLowerCase(); p = e + 1; }
  const type = d[p]; p++;
  if (enc === 1 || enc === 2) { while (p + 1 < d.length && !(d[p] === 0 && d[p + 1] === 0)) p += 2; p += 2; }
  else { while (p < d.length && d[p] !== 0) p++; p++; }
  const data = d.subarray(p);
  if (data.length < 100) return null;
  if (data[0] === 0xFF && data[1] === 0xD8) mime = "image/jpeg";
  else if (data[0] === 0x89 && data[1] === 0x50) mime = "image/png";
  else if (!mime.startsWith("image/")) mime = "image/jpeg";
  return { type, mime, data };
}

function toggle() {
  if (current < 0) {
    if (!songs.length) return;
    setQueue(visible.length ? visible : songs.map(s => s.i));
    playSong(order[0], true);
    return;
  }
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
}

function step(dir) {
  if (!order.length) { if (!songs.length) return; setQueue(songs.map(s => s.i)); }
  if (dir < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
  let pos = order.indexOf(current);
  let n = pos === -1 ? (dir > 0 ? 0 : order.length - 1) : pos + dir;
  if (n >= order.length) n = 0;
  if (n < 0) n = order.length - 1;
  playSong(order[n], true);
}

function setShuffle(on) {
  shuffle = on; rebuildOrder();
  $("shuffle").classList.toggle("on", on);
  $("shuffle").setAttribute("aria-pressed", on);
  saveState();
}
function setRepeat(mode) {
  repeat = mode;
  const b = $("repeat");
  b.classList.toggle("on", mode !== "off");
  b.classList.toggle("repeat-one", mode === "one");
  b.setAttribute("aria-label", "Repeat: " + mode);
  saveState();
}

function markCurrent() {
  document.querySelectorAll(".row").forEach(r => {
    const on = +r.dataset.i === current;
    r.classList.toggle("current", on);
    r.classList.toggle("playing", on && !audio.paused);
  });
}

function updateDockHeart() {
  const h = $("nowHeart");
  if (current < 0) { h.hidden = true; return; }
  const s = songs[current], on = likes.has(s.id);
  h.hidden = false;
  h.classList.toggle("on", on);
  h.setAttribute("aria-pressed", on);
  h.setAttribute("aria-label", (on ? "Unlike " : "Like ") + s.title);
}
$("nowHeart").innerHTML = ICON.heart;
$("nowHeart").onclick = () => { if (current >= 0) toggleLike(songs[current].id); };

// Lock-screen and notification controls
if ("mediaSession" in navigator) {
  const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
  set("play", () => audio.play());
  set("pause", () => audio.pause());
  set("previoustrack", () => step(-1));
  set("nexttrack", () => step(1));
  set("seekto", d => { audio.currentTime = d.seekTime; });
  // iPhone swaps its previous/next buttons for skip-10-seconds buttons when these exist,
  // so they are only added on other phones.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!isIOS) {
    set("seekbackward", d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
    set("seekforward", d => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); });
  }
}
function updatePosition() {
  if (!("mediaSession" in navigator) || !isFinite(audio.duration)) return;
  try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime }); } catch (e) {}
}

// Remember where you left off
function saveState() {
  write("wma-state", { id: current >= 0 ? songs[current].id : null, time: audio.currentTime || 0, shuffle, repeat, queue: queue.map(i => songs[i].id) });
}
function restoreState() {
  const d = read("wma-state", null);
  if (!d) return;
  if (d.repeat === "one") setRepeat("one");   // otherwise keep playing through the list
  queue = (d.queue || []).map(id => byId.get(id)).filter(Boolean).map(s => s.i);
  const s = d.id && byId.get(d.id);
  if (s) { current = s.i; if (!queue.includes(s.i)) queue.unshift(s.i); }
  setShuffle(!!d.shuffle);
  if (s) playSong(s.i, false, d.time || 0);
}

audio.addEventListener("play", () => {
  dock.classList.add("playing");
  $("playPath").setAttribute("d", PAUSE_PATH);
  $("play").setAttribute("aria-label", "Pause");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  markCurrent();
});
audio.addEventListener("pause", () => {
  dock.classList.remove("playing");
  $("playPath").setAttribute("d", PLAY_PATH);
  $("play").setAttribute("aria-label", "Play");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  markCurrent();
  saveState();
});
audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); updatePosition(); });
let lastSave = 0;
audio.addEventListener("timeupdate", () => {
  if (!seeking && audio.duration) bar.value = (audio.currentTime / audio.duration) * 100;
  $("cur").textContent = fmt(audio.currentTime);
  if (Date.now() - lastSave > 5000) { saveState(); updatePosition(); lastSave = Date.now(); }
});
audio.addEventListener("ended", () => {
  if (repeat === "one") { audio.currentTime = 0; audio.play(); return; }
  const pos = order.indexOf(current);
  if (pos === order.length - 1 && repeat === "off") { audio.currentTime = 0; audio.pause(); return; }
  step(1);
});
audio.addEventListener("error", () => {
  if (current < 0 || !audio.src) return;
  $("nowArtist").textContent = "Can’t find music/" + songs[current].file + ". Check the file name in songs.js.";
});

$("play").onclick = toggle;
$("next").onclick = () => step(1);
$("prev").onclick = () => step(-1);
$("shuffle").onclick = () => setShuffle(!shuffle);
$("repeat").onclick = () => setRepeat(repeat === "off" ? "all" : repeat === "all" ? "one" : "off");
bar.addEventListener("input", () => { seeking = true; if (audio.duration) $("cur").textContent = fmt(bar.value / 100 * audio.duration); });
bar.addEventListener("change", () => { if (audio.duration) audio.currentTime = bar.value / 100 * audio.duration; seeking = false; });
$("search").addEventListener("input", e => { query = e.target.value; render(); });
$("sort").addEventListener("change", e => { sortBy = e.target.value; render(); });
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName) || $("sheet").open) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.code === "ArrowRight") step(1);
  if (e.code === "ArrowLeft") step(-1);
});
window.addEventListener("pagehide", saveState);

if (!songs.length) {
  $("content").append(el("p", "empty", "No songs found. Make sure songs.js is uploaded next to index.html."));
} else {
  render();
  restoreState();
}

// Lets Android install this site as an app
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
